<!DOCTYPE html>
<html lang="zh-CN" translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="google" content="notranslate" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />
  <title>印占星空图</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="icon.png" />
  <link rel="apple-touch-icon" href="icon.png" />
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/build/three.module.js",
      "three/addons/": "./vendor/three/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="toolbar">
    <div class="brand">
      <img src="icon.png" alt="" />
      <div class="name">印占星空图</div>
    </div>
    <button id="btn-toolbar-toggle" type="button" aria-expanded="false">设置</button>
    <div id="toolbar-fields">
      <div class="field date">
        <label>公历日期</label>
        <input id="inp-date" type="date" />
      </div>
      <div class="field time">
        <label>时间（24小时）</label>
        <input id="inp-time" type="text" placeholder="14:30:00" inputmode="numeric" />
      </div>
      <div class="field tz">
        <label>时区</label>
        <select id="inp-tz">
          <option value="Asia/Shanghai" selected>北京时间 (UTC+8)</option>
          <option value="UTC">世界时 UTC</option>
          <option value="Asia/Tokyo">东京 (UTC+9)</option>
          <option value="Asia/Kolkata">新德里 (UTC+5:30)</option>
          <option value="Asia/Singapore">新加坡 (UTC+8)</option>
          <option value="Australia/Sydney">悉尼</option>
          <option value="Europe/London">伦敦</option>
          <option value="Europe/Paris">巴黎</option>
          <option value="America/New_York">纽约</option>
          <option value="America/Los_Angeles">洛杉矶</option>
        </select>
      </div>
      <div class="field place">
        <label>地点（可搜索）</label>
        <input id="place-input" type="text" value="北京市" autocomplete="off" spellcheck="false" placeholder="输入城市、区县，或经纬度" />
        <div id="place-suggest"></div>
      </div>
      <div class="field coord">
        <label>北纬</label>
        <input id="inp-lat" type="number" step="0.0001" value="39.904" />
      </div>
      <div class="field coord">
        <label>东经</label>
        <input id="inp-lon" type="number" step="0.0001" value="116.407" />
      </div>
    </div>
    <div class="toolbar-actions">
      <button id="btn-generate" type="button">生成</button>
      <button id="btn-save" type="button">保存截图</button>
      <button id="btn-rotate" type="button" class="on" aria-pressed="true">自动旋转 · 开</button>
    </div>
  </div>

  <div id="stage"></div>
  <div id="vignette"></div>

  <header id="masthead">
    <div class="kicker">恒星黄道 · Lahiri 岁差</div>
    <div id="mast-title">恒星黄道</div>
    <div id="mast-sub"></div>
  </header>

  <aside id="panel" aria-label="五历">
    <button type="button" id="btn-panel-toggle" class="panel-toggle" aria-expanded="false">
      <div class="panel-head">
        <div class="panel-kicker">五历</div>
        <div class="panel-rule"></div>
        <span class="panel-chevron" aria-hidden="true"></span>
      </div>
      <div class="panel-summary" id="panel-summary"></div>
    </button>
    <div id="panel-body"></div>
  </aside>

  <nav id="views">
    <button data-view="sphere" class="on">全景</button>
    <button data-view="close">近景</button>
    <button data-view="orbits">行星轨道</button>
  </nav>

  <div id="hint">
    <span class="hint-desktop">拖动鼠标旋转，滚动滚轮缩放。点「自动旋转」可让星空自己慢慢转，点「生成」按新的时间地点重算。</span>
    <span class="hint-mobile">单指拖动旋转，双指缩放。点「设置」可改时间地点。</span>
  </div>
  <div id="toast"></div>
  <div id="loader"><div class="loader-inner">正在推算天象…</div></div>

  <script type="module" src="js/ui.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
